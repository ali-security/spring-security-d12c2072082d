buildscript {
	dependencies {
		classpath 'io.spring.gradle:spring-build-conventions:0.0.23.RELEASE'
		classpath "org.springframework.boot:spring-boot-gradle-plugin:$springBootVersion"
		classpath 'io.spring.nohttp:nohttp-gradle:0.0.2.RELEASE'
		classpath "io.freefair.gradle:aspectj-plugin:4.0.2"
	}
	repositories {
		maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
		maven { url 'https://maven.aliyun.com/repository/jcenter' }
		maven { url 'https://plugins.gradle.org/m2/' }
	}
}
apply plugin: 'io.spring.nohttp'
apply plugin: 'io.spring.convention.root'

// repo.spring.io no longer serves anonymous downloads; RepositoryConventionPlugin
// hard-codes it as the only project repository, so point it at Maven Central.
allprojects {
	repositories.all { repo ->
		if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.spring.io')) {
			repo.url = 'https://repo.maven.apache.org/maven2/'
		}
	}
}

group = 'org.springframework.security'
description = 'Spring Security'

ext.snapshotBuild = version.contains("SNAPSHOT")
ext.releaseBuild = version.contains("SNAPSHOT")
ext.milestoneBuild = !(snapshotBuild || releaseBuild)

dependencyManagementExport.projects = subprojects.findAll { !it.name.contains('-boot') }

repositories {
	mavenCentral()
}

subprojects {
	plugins.withType(JavaPlugin) {
		project.sourceCompatibility='1.8'
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
	}
}
